# Single service: FastAPI serves the API and the built React UI on :8000.
# Requires GEMINI_API_KEY (answers) and, for issue/PR/discussion history,
# GITHUB_TOKEN in a .env file next to this one (see .env.example).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - repo-assist-data:/data

volumes:
  repo-assist-data:
