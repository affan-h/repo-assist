[project]
name = "repo-assist"
version = "1.0.0"
description = "Agentic RAG over GitHub repositories: grounded, cited answers about code, docs, and project history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[google]>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastembed>=0.7",
    # 0.26.0 segfaults when reading node positions (macOS x86_64, CPython 3.12)
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repo-assist = "repo_assist.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
