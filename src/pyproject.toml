[project]
name = "repo-assist"
version = "0.2.0"
description = "Ask grounded questions about the httpx and got codebases -- backed by a real structural graph, commit/PR/discussion history, docs, and release notes. v2 adds semantic retrieval and multi-agent orchestration alongside v1's proven rule-based router."
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai",
    "requests",
    # v2 additions -- semantic embeddings layer (see embeddings.py's own
    # docstring for why raw onnxruntime is used instead of
    # sentence-transformers: a real, confirmed optimum<->transformers
    # version incompatibility as of Aug 2026 makes the sentence-transformers
    # ONNX backend path broken for this specific model).
    "onnxruntime",
    "huggingface_hub",
    "transformers",
    "numpy",
    "rustworkx",
    "fastapi",
    "uvicorn",
    "pydriller",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "ollama",
    "networkx",
    "pathspec",
]

[project.scripts]
repo-assist = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "api",
    "cli",
    "config",
    "router",
    "synthesizer",
    "query_tools",
    "grader",
    "fetch_pr",
    "fetch_issue",
    "fetch_discussion",
    "fetch_got_releases",
    "link_pr_to_discussions",
    "build_docs_table",
    "build_full_graph",
    "extract_symbols",
    "resolve_imports",
    "resolve_calls",
    "resolve_calls_typed",
    "resolve_calls_typed_ts",
    "resolve_inheritance",
    "rank_symbols",
    "mine_history",
    "index_discussions",
    "compute_churn",
    "compute_complexity",
    "compute_centrality",
    "compute_risk_scores",
    "graph_schema",
    "summarize_symbols",
    "merge_v1_v2",
    # v2 additions
    "orchestrator",
    "embeddings",
    "build_embeddings_index",
    "backfill_missing_docs",
]

[tool.setuptools.packages.find]
include = ["agents*"]
